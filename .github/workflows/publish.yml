name: Publish to Comfy Registry

# ComfyUI Manager installs from the registry, so a release is a version bump in
# pyproject.toml landing on main. Registry versions are immutable — republishing
# the same version fails.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pyproject.toml']

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
